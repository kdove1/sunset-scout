<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunset Scout</title>
  <style>
    body {
      font-family: Georgia, serif;
      background: #2b1b3d;
      color: #ffe8cc;
      max-width: 32rem;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.25rem; }
    button {
      font-size: 1rem;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 6px;
      background: #ff9a3c;
      color: #2b1b3d;
      cursor: pointer;
    }
    #output { margin-top: 1.5rem; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>Sunset Scout</h1>
  <p>Find where the sun will set, and when to be ready.</p>

  <button id="locate">Get my location</button>
  <div id="output"></div>

  <script>
    const button = document.getElementById("locate");
    const output = document.getElementById("output");

    button.addEventListener("click", function () {
      // Some older browsers don't support geolocation at all
      if (!("geolocation" in navigator)) {
        output.textContent = "This browser doesn't support location.";
        return;
      }

      output.textContent = "Finding you...";

      navigator.geolocation.getCurrentPosition(
        // Success: we got a position
        function (position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          output.innerHTML =
            "Latitude: " + lat.toFixed(4) + "<br>" +
            "Longitude: " + lon.toFixed(4);
        },
        // Error: permission denied, no signal, etc.
        function (error) {
          output.textContent = "Couldn't get your location: " + error.message;
        }
      );
    });
  </script>
</body>
</html>
